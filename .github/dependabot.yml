# Config options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - github-actions
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels:
      - go
    commit-message:
      prefix: build
      include: scope
    groups:
      go-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - docker
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels:
      - docker
    commit-message:
      prefix: build
      include: scope
    groups:
      compose-tooling:
        update-types:
          - minor
          - patch
