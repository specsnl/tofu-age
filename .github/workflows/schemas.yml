name: OpenTofu schemas

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/protocol/testdata/*.schema.json'
      - 'scripts/opentofu-schemas.sh'
      - 'taskfiles/Taskfile.schemas.yml'
      - '.github/workflows/schemas.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check OpenTofu schemas
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the vendored schemas against OpenTofu
        run: task schemas:check
